<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Outer Glow Filter -->
    <filter id="badgeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Ring Gradients -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Logo Primary Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Logo Secondary Silver Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>

  <!-- Outer Cyan Halo Ring -->
  <circle cx="100" cy="100" r="92" fill="#FFFFFF" stroke="url(#ringGrad)" stroke-width="5" filter="url(#badgeGlow)" />

  <!-- Inner Soft Blue Shadow Border -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#e0f2fe" stroke-width="3" />

  <!-- Geometric TechTipsTool Emblem -->
  <g transform="translate(100, 96) scale(1.15)">
    <!-- Hexagonal Border Guide (Conceptual Alignment) -->
    <!-- Top Silver Geometric Fold -->
    <path d="M 0 -45 L 35 -25 L 35 -12 L 23 -19 L 23 -26 L 0 -38 L -23 -26 L -23 -19 L -35 -12 L -35 -25 Z" fill="url(#silverGrad)" />
    <path d="M 0 -30 L 20 -18 L 0 -6 L -20 -18 Z" fill="#94a3b8" />

    <!-- Bottom/Middle Cyan Interlocking Fold 1 (Left Wing) -->
    <path d="M -38 -5 L -5 -24 L 5 -18 L -20 -3 L -20 22 L -5 13 L -5 1 L 5 -5 L 5 20 L -30 38 L -38 33 Z" fill="url(#cyanGrad)" />

    <!-- Bottom/Middle Cyan Interlocking Fold 2 (Right Wing) -->
    <path d="M 38 -5 L 38 33 L 30 38 L 5 20 L 5 -5 L -5 1 L -5 13 L -20 22 L -20 -3 L 5 -18 L -5 -24 Z" fill="#0284c7" />
    
    <!-- Central Interlocking Accent -->
    <path d="M 0 -12 L 14 -4 L 0 4 L -14 -4 Z" fill="#38bdf8" opacity="0.9" />
  </g>
</svg>
