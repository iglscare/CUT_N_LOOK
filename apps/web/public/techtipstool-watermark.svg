<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Soft outer glow filter for watermark badge -->
    <filter id="hexGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- White Circular Base Container -->
  <circle cx="100" cy="100" r="94" fill="#FFFFFF" filter="url(#hexGlow)" />

  <!-- Outer Hexagon Frame -->
  <polygon 
    points="100,16 173,58 173,142 100,184 27,142 27,58" 
    fill="none" 
    stroke="#1ba2e6" 
    stroke-width="7" 
    stroke-linejoin="round"
  />

  <!-- 3-Fold Symmetric Interlocking Arm Template -->
  <g stroke-width="6.5" stroke-linecap="square" stroke-linejoin="miter" fill="none">
    
    <!-- Top Arm (Silver / Grey) -->
    <g transform="rotate(0, 100, 100)" stroke="#cccccc">
      <!-- Outer Fold -->
      <path d="M 82 104 L 82 46 L 100 36 L 100 48 L 91 53 L 91 65 L 126 85" />
      <!-- Inner Fold -->
      <path d="M 91 88 L 91 74 L 100 69 L 100 77 L 126 92" />
    </g>

    <!-- Bottom-Right Arm (Cyan / Blue) -->
    <g transform="rotate(120, 100, 100)" stroke="#1ba2e6">
      <!-- Outer Fold -->
      <path d="M 82 104 L 82 46 L 100 36 L 100 48 L 91 53 L 91 65 L 126 85" />
      <!-- Inner Fold -->
      <path d="M 91 88 L 91 74 L 100 69 L 100 77 L 126 92" />
    </g>

    <!-- Bottom-Left Arm (Cyan / Blue) -->
    <g transform="rotate(240, 100, 100)" stroke="#1ba2e6">
      <!-- Outer Fold -->
      <path d="M 82 104 L 82 46 L 100 36 L 100 48 L 91 53 L 91 65 L 126 85" />
      <!-- Inner Fold -->
      <path d="M 91 88 L 91 74 L 100 69 L 100 77 L 126 92" />
    </g>

  </g>
</svg>
